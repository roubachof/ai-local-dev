# ai-local-dev configuration
# Copy this file to config/.qwen-local.conf.local to override without committing.

# ---- Ports ----
LLAMA_PORT=8080
LLAMA_PROXY_PORT=8081
OLLAMA_PORT=11434
OLLAMA_PROXY_PORT=11435
ROUTER_PORT=8090

# ---- 27B model path ----

# ---- Model identifiers / paths ----
QWEN_27B_MODEL="$HOME/.local/share/llama-models/Qwen3.6-27B-UD-Q4_K_XL.gguf"
QWEN_35B_OLLAMA_MODEL="qwen3.6:35b-ud-q4xl"
QWEN_8B_OLLAMA_MODEL="qwen3:8b"
QWEN_SESSION_TOKEN_LIMIT=32000

# ---- llama-server settings ----
LLAMA_CTX_SIZE=65536
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_GPU_LAYERS=99
LLAMA_REASONING_FORMAT=deepseek
LLAMA_CACHE_TYPE_K=q8_0
LLAMA_CACHE_TYPE_V=q8_0

# ---- Ollama runtime tuning ----
# Speeds up long-prefill workloads and reduces KV memory footprint.
OLLAMA_FLASH_ATTENTION=1
OLLAMA_KV_CACHE_TYPE=q8_0
OLLAMA_KEEP_ALIVE=30m

# ---- Thinking controls ----
# Canonical variable used by the unified proxy.
AI_LOCAL_FORCE_THINK=0
# Backward-compatible aliases.
LLAMA_PROXY_FORCE_THINK=0
OLLAMA_PROXY_FORCE_THINK=0
OLLAMA_PROXY_THINK=0

# Optional per-mode default sampling injected by proxy when client omits them.
AI_LOCAL_NOTHINK_TEMP=0.6
AI_LOCAL_NOTHINK_TOP_P=0.95
AI_LOCAL_THINK_TEMP=1.0
AI_LOCAL_THINK_TOP_P=0.95

# Soft warning threshold for Warp Agent context pressure in proxy logs.
# Set to 0 to disable this warning.
AI_LOCAL_WARP_CTX_SOFT_LIMIT=56000

# ---- Runtime state ----
AI_LOCAL_STATE_DIR="$HOME/.local/state/ai-local"
AI_LOCAL_LOG_DIR="$AI_LOCAL_STATE_DIR/logs"
AI_LOCAL_RUN_DIR="$AI_LOCAL_STATE_DIR/run"

# ---- Timeouts ----
PROXY_TIMEOUT=600
SERVICE_STARTUP_WAIT=30

# ---- Runtime behavior ----
# 1 = stop the opposite family before starting a stack (recommended on 48GB).
# 0 = allow 27B and Ollama stacks to remain up simultaneously.
AI_LOCAL_SINGLE_MODEL_MODE=1
