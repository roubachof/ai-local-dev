# ai-local-dev configuration
# Copy this file to config/.qwen-local.conf.local to override without committing.

# ---- Ports ----
LLAMA_PORT=8080              # 27B llama-server
LLAMA_35B_PORT=8083          # 35B llama-server
LLAMA_PROXY_PORT=8081        # 27B no-think proxy
PROXY_35B_PORT=11435         # 35B no-think proxy (kept at 11435 for client compat)
ROUTER_PORT=8090

# ---- Model identifiers / paths ----
# 27B: Q4_K_XL is the quality/speed sweet spot on 48GB. The MTP GGUF is the
# default model file (it also runs fine without --spec-type); keep a non-MTP
# GGUF as an alternate if you want it. See bench/README.md for the measured
# MTP decode speedup on Apple Silicon (+42% on 27B, +23% on 35B-A3B).
# NOTE: unsloth's MTP repos name files WITHOUT an -MTP- suffix (e.g. the MTP file is
# also called Qwen3.6-27B-UD-Q4_K_XL.gguf). To avoid the MTP download silently
# overwriting the non-MTP GGUF of the same name, the MTP variants live in a
# dedicated `mtp/` subdirectory.
QWEN_27B_MODEL="$HOME/.local/share/llama-models/Qwen3.6-27B-UD-Q4_K_XL.gguf"
QWEN_27B_MTP_MODEL="$HOME/.local/share/llama-models/mtp/Qwen3.6-27B-UD-Q4_K_XL.gguf"
# 35B-A3B MoE: MTP GGUF default (unsloth Q4_K_XL, ~22G). Non-MTP fallback kept for LLAMA_MTP=0.
QWEN_35B_MODEL="$HOME/.local/share/llama-models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
QWEN_35B_MTP_MODEL="$HOME/.local/share/llama-models/mtp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
QWEN_SESSION_TOKEN_LIMIT=32000

# ---- llama-server settings (shared by 27B and 35B unless overridden) ----
LLAMA_CTX_SIZE=65536         # 27B context
LLAMA_35B_CTX_SIZE=131072    # 35B context: 128k sweet spot (hybrid KV is tiny — 10 of 40 layers full-attention)
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_GPU_LAYERS=99
LLAMA_REASONING_FORMAT=deepseek
LLAMA_CACHE_TYPE_K=q8_0
LLAMA_CACHE_TYPE_V=q8_0
# Hybrid Gated-DeltaNet cache + MTP flags (the multi-turn agentic perf fix):
#   --ctx-checkpoints / --checkpoint-every-n-tokens: 40-80x warm-turn prefill speedup
#     (without these, every turn re-prefills the full context)
#   --swa-full: bounded KV for the SWA attention layers (memory-efficient long context)
LLAMA_CTX_CHECKPOINTS=128
LLAMA_CHECKPOINT_EVERY_N_TOKENS=4096
LLAMA_SWA_FULL=1
# Multi-Token Prediction speculative decoding. On by default: MTP gives a
# real decode speedup on Apple Silicon/Metal (measured +42% on the 27B dense,
# +23% on the 35B-A3B MoE on M3 Max — see bench/README.md). Set to 0 to skip
# --spec-type and the MTP draft context (saves a little RAM).
LLAMA_MTP=1
LLAMA_MTP_N_MAX_27B=3        # dense 27B: 3 is the acceptance sweet spot
LLAMA_MTP_N_MAX_35B=2        # MoE 35B: 2 (3+ degrades acceptance per MoE benchmarks)
# preserve_thinking=true is REQUIRED for the checkpoint cache to reuse prefixes
# across turns when thinking is on — otherwise the chat template strips reasoning
# from history and the prefix breaks every turn.
LLAMA_PRESERVE_THINKING=1

# ---- Thinking controls ----
# Canonical variable used by the unified proxy.
AI_LOCAL_FORCE_THINK=0
# Legacy alias still honored.
LLAMA_PROXY_FORCE_THINK=0

# Optional default sampling injected by proxy when the client omits them.
AI_LOCAL_NOTHINK_TEMP=0.6
AI_LOCAL_NOTHINK_TOP_P=0.95
AI_LOCAL_THINK_TEMP=1.0
AI_LOCAL_THINK_TOP_P=0.95

# Soft warning threshold for Warp Agent context pressure in proxy logs.
# Set to 0 to disable this warning.
AI_LOCAL_WARP_CTX_SOFT_LIMIT=56000

# ---- Runtime state ----
AI_LOCAL_STATE_DIR="$HOME/.local/state/ai-local"
AI_LOCAL_LOG_DIR="$AI_LOCAL_STATE_DIR/logs"
AI_LOCAL_RUN_DIR="$AI_LOCAL_STATE_DIR/run"

# ---- Timeouts ----
PROXY_TIMEOUT=600
# Loading an 18-22G GGUF + allocating 64k-128k context + MTP draft context takes
# >30s on M3 Max. Set generously so `ai-local 27b`/`35b` don't false-fail on startup.
SERVICE_STARTUP_WAIT=90

# ---- Runtime behavior ----
# 1 = stop the opposite family before starting a stack (recommended on 48GB).
# 0 = allow 27B and 35B stacks to remain up simultaneously.
AI_LOCAL_SINGLE_MODEL_MODE=1
