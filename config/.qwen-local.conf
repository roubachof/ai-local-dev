# Qwen Local Setup Configuration
# Sourced by scripts/qwen-switch.sh and used by proxy services.
# Copy to .qwen-local.conf.local to override without committing.

# ---- Port Configuration ----
LLAMA_PORT=8080
LLAMA_PROXY_PORT=8081
OLLAMA_PORT=11434
OLLAMA_PROXY_PORT=11435

# ---- Model Paths ----
QWEN_27B_MODEL="$HOME/.local/share/llama-models/Qwen3.6-27B-UD-Q4_K_XL.gguf"

# ---- llama-server Parameters ----
LLAMA_CTX_SIZE=131072
LLAMA_TEMP=0.6
LLAMA_TOP_P=0.95
LLAMA_TOP_K=20
LLAMA_GPU_LAYERS=99

# ---- Proxy Force-Think (set to 1 to enable thinking) ----
# Applies to both Ollama and llama-server proxies.
OLLAMA_PROXY_FORCE_THINK=0
LLAMA_PROXY_FORCE_THINK=0

# ---- Service Timeouts (seconds) ----
PROXY_TIMEOUT=600
SERVICE_STARTUP_WAIT=10
